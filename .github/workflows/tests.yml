# MEJ-1 (F5): CI de red de seguridad.
# Corre la suite pytest y el gate de regresion byte-identico en cada push/PR.
# El baseline (tests/baseline.json) fue generado con Python 3.13 y es el mismo
# SHA en Windows y Linux (el gate normaliza EOL; detalle en la descripcion de
# tests/baseline.json y en docs/CHANGELOG.md, entrada MEJ-1 2026-07-04).
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # pygame-ce solo se usa para leer el TMX (headless); sin display en CI.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # warehouse.db NO se versiona (Ley 7): se regenera desde el Excel canonico.
      # Verificado 2026-07-04: una BD recien migrada reproduce el baseline
      # byte-identico (sin ella, el motor cae al fallback Excel y el SHA difiere).
      # 2026-09-27: va ANTES de pytest. Desde el 19/09 dos tests copiaban la base
      # y la CI fallaba en cada push (y el gate no llegaba a correr); ademas asi
      # no se saltean los tests que necesitan la base.
      - name: Migrar Excel -> SQLite (warehouse.db)
        run: python run_migration.py

      - name: Suite de red de seguridad (unit)
        run: python -m pytest -q

      - name: Gate de regresion byte-identico
        run: |
          set -o pipefail
          python scripts/regression_gate.py | tee gate.log

      # Diagnostico visible sin auth (anotacion publica) si el gate falla.
      - name: Publicar detalle del fallo del gate
        if: failure()
        run: |
          detalle=$(grep -E 'esperado|obtenido|WARN|FAIL' gate.log | tr '\n' ' | ' || true)
          echo "::notice title=GATE DETAIL::${detalle}"
